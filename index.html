<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X01k-Challenge</title>
<meta name="theme-color" content="#123d25">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#ece4cf; --surface:#faf6ec; --surface2:#e2d7bb; --key:#f4eddc; --ink:#1c201d; --muted:#5d5f55; --line:#c9bc98;
  --green:#16703c; --green-soft:#d3e7d4; --red:#b22a26; --red-soft:#f3d9d4;
  --status-bg:#1b5e36; --status-ink:#f6f1e2; --status-muted:#bfdcc6;
  --focus:#2463d6; --fs:16px;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131614; --surface:#1c201d; --surface2:#272c28; --key:#232824; --ink:#ebe4d0; --muted:#9d9a88; --line:#363c37;
    --green:#36a463; --green-soft:#1d3a28; --red:#de4a43; --red-soft:#3f201e;
    --status-bg:#123d25; --status-ink:#f1ebd8; --status-muted:#93bd9f; --focus:#7fb0ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131614; --surface:#1c201d; --surface2:#272c28; --key:#232824; --ink:#ebe4d0; --muted:#9d9a88; --line:#363c37;
  --green:#36a463; --green-soft:#1d3a28; --red:#de4a43; --red-soft:#3f201e;
  --status-bg:#123d25; --status-ink:#f1ebd8; --status-muted:#93bd9f; --focus:#7fb0ff; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{height:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.88rem}

/* Screens */
.scr{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-family:var(--cond);font-weight:600;font-size:1.6rem;margin:0}
.top .sp{flex:1}
.back{border:0;background:none;padding:.4rem .2rem;font-weight:600;color:var(--green);white-space:nowrap}
.body{flex:1;overflow:auto;padding:1.25rem 1rem 2.5rem}
.wrap{max-width:980px;margin:0 auto}
h2{font-family:var(--cond);font-weight:600;font-size:1.4rem;margin:1.6rem 0 .6rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.6rem 1rem;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.dan{color:var(--red);border-color:var(--red);background:transparent}
.btn.sm{padding:.35rem .7rem;font-size:.9rem}
.btn.big{padding:.9rem 1.6rem;font-size:1.1rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.grow{flex:1;min-width:12rem}
.empty{padding:1.1rem 1rem;color:var(--muted)}
.cnum{font-family:var(--cond);font-weight:600;font-size:1.35rem}
.mini{height:6px;border-radius:3px;background:var(--surface2);margin:.35rem 0;overflow:hidden;max-width:420px}
.mini i{display:block;height:100%;background:var(--green)}
input[type=text]{font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
input[type=checkbox],input[type=radio]{width:1.15rem;height:1.15rem;accent-color:var(--green);margin:0}
textarea{width:100%;min-height:11rem;font:.8rem/1.35 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.5rem}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2.5rem;max-width:1000px;margin:0 auto;min-height:100%;align-items:center;padding:1rem .25rem}
.brand{display:flex;flex-direction:column;gap:1rem}
.brand svg{width:min(220px,46vw);height:auto}
.brand h1{font-family:var(--cond);font-size:clamp(2.8rem,6vw,4rem);line-height:.95;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font-size:1.1rem}
.menu{display:flex;flex-direction:column;gap:.75rem}
.mi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.15rem;padding:1rem 1.25rem;border:1px solid var(--line);border-left:6px solid var(--green);background:var(--surface);border-radius:6px}
.mi b{font-family:var(--cond);font-size:1.7rem;font-weight:600;line-height:1.1}
.mi span{color:var(--muted)}
.runcard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:6px;padding:1rem 1.25rem;background:var(--status-bg);color:var(--status-ink)}
.runcard b{font-family:var(--cond);font-size:3.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.runcard span{color:var(--status-muted)}
@media (max-width:720px){.home{grid-template-columns:1fr;gap:1.5rem;align-items:start}}

/* New challenge */
.targets{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem}
.targets button.ex,.seg button.ex{border-style:dashed}
.targets button{font-family:var(--cond);font-size:1.7rem;font-weight:600;padding:.8rem .3rem;border:2px solid var(--line);background:var(--surface);border-radius:8px;font-variant-numeric:tabular-nums}
.targets button.on{border-color:var(--green);background:var(--green-soft)}
.psel{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.5rem}
.psel button{display:flex;align-items:center;gap:.6rem;text-align:left;padding:.65rem .8rem;border:2px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600}
.psel button.on{border-color:var(--green)}
.psel button:disabled{opacity:.45;cursor:not-allowed}
.no{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);font-family:var(--cond);font-size:1.1rem}
.psel button.on .no{background:var(--green);color:#fff}
.addp{display:flex;gap:.5rem;margin-top:.75rem}
.addp input{flex:1}
.startbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:2rem}
@media (max-width:900px){.targets{grid-template-columns:repeat(4,1fr)}}
@media (max-width:520px){.targets{grid-template-columns:repeat(3,1fr)}}

/* Game */
.game{--kfs:clamp(1.3rem,2.4vw,1.8rem);height:100%;display:flex;flex-direction:column}
.gbar{display:flex;align-items:center;gap:.75rem;padding:.4rem .75rem;background:var(--surface);border-bottom:1px solid var(--line)}
.gbar .lbl{font-size:.85rem;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:.35rem;overflow-x:auto;flex:1;padding:.15rem}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.35rem .85rem;white-space:nowrap;color:var(--muted);font-weight:500}
.chip.on{background:var(--green-soft);border-color:var(--green);color:var(--ink);font-weight:600}
.chip.cur{box-shadow:inset 0 0 0 2px var(--green)}
.board{flex:1;min-height:0;overflow:auto;display:grid;gap:.6rem;padding:.6rem;
  grid-template-columns:minmax(0,1fr) minmax(0,1.75fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"sl st sr" "sl pd sr"}
.board.few{grid-template-areas:"sl st sr" "sl pd sr"}
.sl{grid-area:sl}.sr{grid-area:sr}
.side{min-width:0;min-height:0;display:grid;grid-template-rows:repeat(var(--rows,2),minmax(0,1fr));gap:.6rem}
.tslot{min-width:0;min-height:0;contain:size;overflow:hidden}
.tile{--tf:calc(var(--kfs)*var(--ts,1));background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:100%}
.tile header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:calc(.35rem*var(--ts,1)) .7rem;background:var(--surface2);font-family:var(--cond);font-weight:600;font-size:var(--tf)}
.tile.cur{border:2px solid var(--green);background:var(--green-soft)}
.tile.cur dt,.tile.cur dd{border-top-color:color-mix(in srgb,var(--green) 25%,transparent)}
.tile.cur header{background:var(--green);color:#fff}
.tag{font-family:var(--body);font-size:.72rem;font-weight:600;padding:.1rem .45rem;border-radius:4px;background:var(--red-soft);color:var(--red);white-space:nowrap}
.tile.cur .tag{background:rgba(255,255,255,.22);color:#fff}
.tile dl{margin:0;display:grid;grid-template-columns:1fr auto}
.tile dt,.tile dd{margin:0;padding:calc(.25rem*var(--ts,1)) .7rem;border-top:1px solid var(--line);line-height:1.15}
.tile dt{color:var(--muted);font-family:var(--cond);font-weight:500;font-size:var(--tf);display:flex;align-items:center}
.tile dd{font-family:var(--cond);font-weight:600;font-size:var(--tf);text-align:right;font-variant-numeric:tabular-nums}
.hint{padding:1rem;border:2px dashed var(--line);border-radius:8px;color:var(--muted);align-self:start}
.status{grid-area:st;background:var(--status-bg);color:var(--status-ink);border-radius:8px;padding:.8rem 1rem .9rem;display:flex;flex-direction:column;gap:.6rem;min-height:20rem}
.scored{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;flex:1}
.scored .big{font-family:var(--cond);font-weight:700;font-size:clamp(5.4rem,12vw,9.6rem);line-height:.9;font-variant-numeric:tabular-nums}
.scored .of{color:var(--status-muted);font-size:1.65rem;text-align:center}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--status-ink)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 2px),var(--status-bg) calc(5% - 2px) 5%)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.trio div+div{border-left:1px solid rgba(255,255,255,.2)}
.trio b{display:block;font-family:var(--cond);font-weight:600;font-size:calc(var(--kfs)*1.5);line-height:1.05;font-variant-numeric:tabular-nums}
.trio span{font-family:var(--cond);font-weight:500;font-size:calc(var(--kfs)*1.5);line-height:1.05;color:var(--status-muted);white-space:nowrap}
.pad{grid-area:pd;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:minmax(4.4rem,1.5fr) repeat(5,minmax(2.9rem,1fr));gap:4px;background:var(--line);border:4px solid var(--line);border-radius:8px;min-height:0}
.k{border:0;background:var(--key);font-family:var(--cond);font-weight:600;font-size:var(--kfs);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;font-variant-numeric:tabular-nums}
.k:active{filter:brightness(.9)}
.k.dbl{color:var(--red)} .k.dbl.armed{background:var(--red);color:#fff}
.k.trp{color:var(--green)} .k.trp.armed{background:var(--green);color:#fff}
.k.clr{background:var(--red);color:#fff} .k.ok{background:var(--green);color:#fff}
.k.lastk{background:#2b5797;color:#fff} .k.lastk small{color:rgba(255,255,255,.82)}
.k small{font-family:var(--cond);font-size:var(--kfs);font-weight:600;line-height:1;color:var(--muted)}
.k:disabled{opacity:.4;cursor:default}
.k.q{font-size:clamp(1.1rem,2vw,1.45rem);color:var(--muted)}
.disp{grid-column:span 3;border:0;background:var(--surface);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:.1rem .3rem;min-width:0;overflow:hidden}
.disp.wide{grid-column:span 5;flex-direction:row;align-items:baseline;gap:1.5rem}
.disp .who{font-size:1.6rem;line-height:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slots{display:flex;align-items:baseline;gap:.4rem;font-family:var(--cond);font-weight:600;font-size:clamp(1.4rem,2.9vw,2.1rem);line-height:1}
.slots .sl{min-width:2.1em;text-align:center;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0 .1rem .1rem;background:none;font:inherit;color:inherit;line-height:1}
.slots .sl.void{color:var(--muted);text-decoration:line-through}
.slots .sl.next{border-color:var(--green)}
.slots .sl.sel{background:var(--green-soft);border-bottom:3px solid var(--green);border-radius:4px 4px 0 0}
.slots em{font-style:normal;color:var(--green);min-width:2em;text-align:right}
.tot{font-family:var(--cond);font-weight:700;font-size:clamp(1.8rem,3.5vw,2.4rem);line-height:1}
@media (max-width:820px),(orientation:portrait){
  .board{grid-template-columns:1fr 1fr;grid-template-rows:auto;grid-template-areas:"st st" "sl sr" "pd pd"}
  .board.few{grid-template-areas:"st st" "sl sr" "pd pd"}
  .side{grid-template-rows:none;align-content:start}
  .tslot{contain:none;overflow:visible}
  .tile{height:auto}
  .pad{grid-template-rows:5rem repeat(5,3.4rem)}
}

/* Stats */
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:1.5rem;align-items:start}
@media (max-width:780px){.split{grid-template-columns:1fr}}
.prow{display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem .35rem .25rem;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.sel{background:var(--green-soft)}
.pname{flex:1;border:0;background:none;text-align:left;padding:.45rem .6rem;font-weight:600;display:flex;align-items:center;gap:.5rem;min-width:0}
.linkbtn{border:0;background:none;color:var(--green);font-weight:600;padding:.6rem 0}
.seg{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.75rem}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.4rem .8rem;font-weight:500}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:.75rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.6rem 1.1rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--green)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.st th,.st td{padding:.4rem .75rem;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.st th:first-child,.st td:first-child{text-align:left}
.st thead th{font-family:var(--cond);font-size:1.15rem;font-weight:600;border-top:0}
.st tr.grp td{background:var(--green);color:#fff;font-weight:600;text-align:left}
.st td.better{color:var(--green);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem;margin-bottom:1rem}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem}
.kv b{display:block;font-family:var(--cond);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.kv span{font-size:.85rem;color:var(--muted)}

/* Settings */
.set{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-bottom:1rem}
.set h2{margin-top:0}
.set h3{font-size:1rem;margin:1rem 0 .4rem}
.opt{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;cursor:pointer}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 1rem}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}

/* Modal + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.mod{background:var(--surface);border-radius:12px;padding:1.25rem 1.3rem;max-width:540px;width:100%;max-height:90%;overflow:auto}
.mod h2{margin-top:0}
.acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
.cibtns{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.cibtns button{font-family:var(--cond);font-size:1.6rem;font-weight:600;padding:1rem .5rem;border:2px solid var(--green);background:var(--green-soft);border-radius:8px}
.mod{position:relative}
.mod.wide{max-width:640px}
.x{position:absolute;top:.5rem;right:.5rem;width:2.4rem;height:2.4rem;border:0;background:none;font-size:1.7rem;line-height:1;color:var(--muted);border-radius:50%}
.x:hover{background:var(--surface2)}
.pshead{display:flex;align-items:center;justify-content:center;gap:.75rem;margin:0 2.5rem .2rem}
.pshead h2{margin:0;min-width:8rem;text-align:center;font-size:1.8rem}
.arr{width:2.8rem;height:2.8rem;border:1px solid var(--line);background:var(--surface2);border-radius:50%;font-size:1.5rem;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.psub{text-align:center;margin:0 0 .8rem}
.ckl{display:flex;align-items:center;gap:.6rem;cursor:pointer}
.ckl.nock{padding-left:1.75rem;cursor:default}
.tile header .dran{margin-right:auto;font-weight:500}
.tname{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline dotted;text-underline-offset:4px;text-decoration-thickness:1px}
#toastwrap{position:fixed;left:0;right:0;top:0;padding:calc(3.6rem + env(safe-area-inset-top,0px)) 1rem 0;display:flex;justify-content:center;pointer-events:none;z-index:30}
#toast{background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:8px;max-width:520px;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastwrap"><div id="toast" role="status" aria-live="polite"></div></div>
<script>
'use strict';
/* ---------- Speicher (IndexedDB, Fallback localStorage) ---------- */
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('x01k',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
  get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  set(k,v){try{if(this.db)this.db.transaction('kv','readwrite').objectStore('kv').put(v,k);else localStorage.setItem('x01k',JSON.stringify(v))}catch(e){}},
  write(puts,dels){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction('kv','readwrite'),os=tx.objectStore('kv');for(const [k,v] of puts)os.put(v,k);for(const k of dels)os.delete(k);tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})},
  getMany(keys){return new Promise(res=>{if(!this.db||!keys.length)return res([]);try{const tx=this.db.transaction('kv'),os=tx.objectStore('kv'),out=new Array(keys.length);keys.forEach((k,i)=>{const q=os.get(k);q.onsuccess=()=>{out[i]=q.result}});tx.oncomplete=()=>res(out);tx.onerror=()=>res([])}catch(e){res([])}})}
};

const CH=500,sigs=new Map();let saveT,saving=false,again=false;
const sigOf=part=>{const l=part[part.length-1];return part.length+'|'+part[0].t+'|'+l.t+'|'+l.s+'|'+l.p};
function save(){clearTimeout(saveT);saveT=setTimeout(flush,400)}
async function flush(){if(saving){again=true;return}saving=true;
  try{if(!DB.db){try{localStorage.setItem('x01k',JSON.stringify(S))}catch(e){}return}
    const puts=[],seen=new Set(),games=[];
    for(const g of S.games){const {visits,...h}=g,n=Math.ceil(visits.length/CH);h.chunks=n;games.push(h);
      for(let i=0;i<n;i++){const k=`v:${g.id}:${i}`,part=visits.slice(i*CH,(i+1)*CH),sg=sigOf(part);seen.add(k);if(sigs.get(k)!==sg){puts.push([k,part]);sigs.set(k,sg)}}}
    puts.push(['meta',{v:2,players:S.players,settings:S.settings,games}]);
    const dels=[...sigs.keys()].filter(k=>!seen.has(k));dels.forEach(k=>sigs.delete(k));
    if(!await DB.write(puts,dels))sigs.clear()}
  finally{saving=false;if(again){again=false;flush()}}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(saveT);flush()}});

    m.games.forEach(g=>{g.visits=[];for(let i=0;i<(g.chunks||0);i++){const part=parts[j++]||[];for(const v of part)g.visits.push(v);if(part.length)sigs.set(`v:${g.id}:${i}`,sigOf(part))}delete g.chunks});
    return {v:1,players:m.players,games:m.games,settings:m.settings}}
  let st=await DB.get('state');if(!st){try{const l=localStorage.getItem('x01k');if(l)st=JSON.parse(l)}catch(e){}}

/* Darts einer Aufnahme auswerten (Double-In) */
function evalDarts(darts,inBefore){let inn=inBefore,s=0,pre=0,ci=false,miss=0;
  for(const [g,m] of darts){if(!inn){if(m===2&&g>0){inn=true;ci=true;s+=g*m}else pre++}else{s+=g*m;if(g===0)miss++}}
  return {s,pre,ci,miss,n:darts.length}}

/* Spielerwerte innerhalb einer Challenge */
const acc=()=>({dpos:[[0,0],[0,0],[0,0]],dD:0,dmiss:0,dbl:0,bull:0,t20:0,t19:0,t18:0,btv:0,vis:[],darts:0,post:0,score:0,preCum:0,inn:false,dtc:null,miss:0,missKnown:false,s90:0,s130:0,s180:0,hi:0});
function addV(a,v){if(v.m==='d'){let ii=a.inn,bt=false;v.d.forEach(([s,m],i)=>{a.dpos[i][1]++;if(!ii){if(m===2&&s>0)ii=true;else return}a.dpos[i][0]+=s*m;a.dD++;if(s===0)a.dmiss++;if(m===2)a.dbl++;if(s===25)a.bull++;if(m===3&&s>=18&&s<=20){a['t'+s]++;bt=true}});if(bt)a.btv++}a.vis.push(v);a.darts+=v.n;a.post+=v.n-v.pre;a.score+=v.s;
  if(!a.inn){a.preCum+=v.pre;if(v.ci){a.inn=true;a.dtc=a.preCum+1}}
  a.miss+=v.miss;if(v.m==='d')a.missKnown=true;
  if(v.s===180)a.s180++;else if(v.s>=130)a.s130++;else if(v.s>=90)a.s90++;if(v.s>a.hi)a.hi=v.s}
function gameAgg0(g){const per={};let tot=0,post=0,darts=0;g.parts.forEach(p=>per[p]=acc());
  for(const v of g.visits){addV(per[v.p]||(per[v.p]=acc()),v);tot+=v.s;post+=v.n-v.pre;darts+=v.n}
  return {per,tot,post,darts,cavg:darts?tot/darts*3:null}}
/* Ergebnis nur neu berechnen, wenn sich Aufnahmen oder Teilnehmer geändert haben */
const aggC=new WeakMap();
function gameAgg(g){const v=g.visits,l=v[v.length-1],key=v.length+'|'+(l?l.t+'|'+l.s+'|'+l.p:'')+'|'+g.parts.join();
  const c=aggC.get(g);if(c&&c.key===key)return c.res;const res=gameAgg0(g);aggC.set(g,{key,res});return res}
function avg100(a){let d=0,s=0;for(let i=a.vis.length-1;i>=0&&d<100;i--){const v=a.vis[i],pd=v.n;if(!pd)continue;const t=Math.min(pd,100-d);s+=v.s*t/pd;d+=t}return d?s/d*3:null}
function gameDur(g){let d=0;for(let i=1;i<g.visits.length;i++)d+=Math.min(g.visits[i].t-g.visits[i-1].t,300000);return d}

  const pt=(r,a)=>(C+Math.cos(a)*r).toFixed(2)+' '+(C+Math.sin(a)*r).toFixed(2);

/* Statistik über Challenges und Zeiträume */
function range(per,o){const n=new Date();let a,b;
  if(per==='tag'){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-o);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1)}
  else if(per==='monat'){a=new Date(n.getFullYear(),n.getMonth()-o,1);b=new Date(a.getFullYear(),a.getMonth()+1,1)}
  else if(per==='jahr'){a=new Date(n.getFullYear()-o,0,1);b=new Date(a.getFullYear()+1,0,1)}
  else return [0,8.64e15];return [a.getTime(),b.getTime()]}
function rangeLabel(per,o){const [a]=range(per,o);if(per==='tag')return o?'Gestern':'Heute';if(per==='monat')return new Date(a).toLocaleDateString('de-DE',{month:'long',year:'numeric'});if(per==='jahr')return String(new Date(a).getFullYear());return 'Gesamt'}
function calc(pid,mode,[a,b],gid){const r={games:new Set(),vis:0,darts:0,post:0,score:0,hi:0,s90:0,s130:0,s180:0,dpos:[[0,0],[0,0],[0,0]],dD:0,trip:0,dbl:0,bull:0,miss:0,dtc:[],dur:0,t20:0,t19:0,t18:0,btv:0};
  for(const g of S.games){if(gid&&g.id!==gid)continue;if(mode!=='all'&&g.target!==+mode)continue;const pre={},inn={};let lt=null;
    for(const v of g.visits){const gap=lt==null?0:Math.min(v.t-lt,300000);lt=v.t;const was=!!inn[v.p];let dtcv=null;
      if(!was){pre[v.p]=(pre[v.p]||0)+v.pre;if(v.ci){inn[v.p]=true;dtcv=pre[v.p]+1}}
      if((pid!=='all'&&v.p!==pid)||v.t<a||v.t>=b)continue;
      r.games.add(g.id);r.vis++;r.darts+=v.n;r.post+=v.n-v.pre;r.score+=v.s;r.dur+=gap;if(v.s>r.hi)r.hi=v.s;
      if(v.s===180)r.s180++;else if(v.s>=130)r.s130++;else if(v.s>=90)r.s90++;
      if(dtcv!=null)r.dtc.push(dtcv);
      if(v.m==='d'){let i2=was,bt=false;v.d.forEach(([s,m],i)=>{r.dpos[i][1]++;if(!i2){if(m===2&&s>0)i2=true;else return}
        r.dD++;r.dpos[i][0]+=s*m;if(s===0)r.miss++;if(m===3){r.trip++;if(s>=18&&s<=20){r['t'+s]++;bt=true}}if(m===2)r.dbl++;if(s===25)r.bull++});if(bt)r.btv++}}}
  return r}
const da=(r,i)=>r.dpos[i][1]?r.dpos[i][0]/r.dpos[i][1]:null;
const ROWS=[
  ['g','Umfang'],['Challenges',r=>r.games.size,fi,0],['Aufnahmen',r=>r.vis,fi,0],['Darts',r=>r.darts,fi,0],
  ['g','Average'],['3-Dart-AVG',r=>r.darts?r.score/r.darts*3:null,f1,1],['Höchste Aufnahme',r=>r.vis?r.hi:null,fi,1],
  ['g','Single-Dart-AVG (nur Einzeldart-Eingabe)'],['1. Dart',r=>da(r,0),f2,1],['2. Dart',r=>da(r,1),f2,1],['3. Dart',r=>da(r,2),f2,1],
  ['g','Scoring'],['Gesamtscore',r=>r.score,fi,0],['90+ Aufnahmen',r=>r.s90,fi,1],['130+ Aufnahmen',r=>r.s130,fi,1],['180er',r=>r.s180,fi,1],
  ['g','Big Triples (nur Einzeldart-Eingabe)'],['Anzahl T20',r=>r.dD?r.t20:null,fi,1],['Anzahl T19',r=>r.dD?r.t19:null,fi,1],['Anzahl T18',r=>r.dD?r.t18:null,fi,1],['Aufnahmen mit Big Triple',r=>r.dD?r.btv:null,fi,1],
  ['g','Treffer (nur Einzeldart-Eingabe)'],['Double-Quote',r=>r.dD?r.dbl/r.dD:null,fp,1],['Bull-Treffer',r=>r.dD?r.bull:null,fi,1],['Miss',r=>r.dD?r.miss:null,fi,-1],['Miss-Quote',r=>r.dD?r.miss/r.dD:null,fp,-1],
  ['g','Check-In'],['Check-Ins',r=>r.dtc.length,fi,0],['Ø Darts to Check-In',r=>r.dtc.length?r.dtc.reduce((s,x)=>s+x,0)/r.dtc.length:null,f1,-1],['Bester Check-In',r=>r.dtc.length?Math.min(...r.dtc):null,fi,-1],
  ['g','Spieldauer'],['Gesamt',r=>r.vis?r.dur:null,fhms,0]];

const $app=document.getElementById('app');let lastScr=null;
/* Kachelinhalte verkleinern, bis sie in ihren Platz passen */
let fitKey='',fitVal=1;
function fitTiles(){const ts=[...document.querySelectorAll('.tslot>.tile')];if(!ts.length)return;
  if(!getComputedStyle(ts[0].parentElement).contain.includes('size')){ts.forEach(t=>t.style.setProperty('--ts',1));return}
  const key=[innerWidth,innerHeight,S.settings.font,S.settings.tiles.join(),ts.map(t=>t.querySelector('header').textContent).join()].join('|');
  if(key!==fitKey){ts.forEach(t=>t.style.setProperty('--ts',1));const over=()=>ts.some(t=>t.scrollHeight>t.clientHeight+1);let lo=1;
    if(over()){lo=.25;let hi=1;for(let k=0;k<9;k++){const m=(lo+hi)/2;ts.forEach(t=>t.style.setProperty('--ts',m));if(over())hi=m;else lo=m}}
    fitKey=key;fitVal=lo}
  ts.forEach(t=>t.style.setProperty('--ts',fitVal))}
window.addEventListener('resize',()=>{if(ui.screen==='game')fitTiles()});
if(document.fonts)document.fonts.ready.then(()=>{fitKey='';if(ui.screen==='game')fitTiles()});
function render(){
  const keep=lastScr===ui.screen,sc=[...$app.querySelectorAll('.body,.board,.mod')].map(e=>e.scrollTop);
  let h;switch(ui.screen){case 'games':h=vGames();break;case 'new':h=vNew();break;case 'game':h=vGame();break;case 'sum':h=vSum();break;case 'players':h=vPlayers();break;case 'settings':h=vSettings();break;default:h=vHome()}
  $app.innerHTML=h+vModal();
  if(keep)[...$app.querySelectorAll('.body,.board,.mod')].forEach((e,i)=>{if(sc[i])e.scrollTop=sc[i]});
  if(ui.screen==='game')fitTiles();lastScr=ui.screen}
function applyTheme(){const r=document.documentElement,t=S.settings.theme;if(t==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);r.style.setProperty('--fs',({s:14,m:16,l:18,xl:20}[S.settings.font]||16)+'px')}
let wl=null,wlT=null;const WAKE_MIN=5;
async function wake(on){clearTimeout(wlT);try{const m=S.settings.wake;
  if(on&&m!=='off'&&'wakeLock' in navigator){if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
    if(m==='idle')wlT=setTimeout(()=>wake(false),WAKE_MIN*60000)}
  else if(wl){await wl.release();wl=null}}catch(e){wl=null}}
document.addEventListener('pointerdown',()=>{if(ui.screen==='game'&&S.settings.wake==='idle')wake(true)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ui.screen==='game')wake(true)});

function advance(g){const len=g.parts.length;if(!g.active.length){g.cur=null;return}const idx=g.parts.indexOf(g.cur);
  for(let k=1;k<=len;k++){const c=g.parts[(idx+k+len)%len];if(g.active.includes(c)){g.cur=c;return}}}
function pushVisit(g,v){g.visits.push(v);clearEd();if(gTot(g)>=g.target){g.finished=Date.now();ui.modal={type:'finish'}}else advance(g);save();render()}
function canThrow(g){if(g.finished){toast('Die Challenge ist geschafft. Mit „Last“ lässt sich die letzte Aufnahme korrigieren.');return false}
  if(!g.cur){toast('Kein Spieler aktiv. Oben in der Leiste einen Spieler antippen.');return false}return true}
function dart(s,m){const g=game();if(!canThrow(g))return;
  if(ui.ed.sel!=null&&ui.ed.darts[ui.ed.sel]){ui.ed.darts[ui.ed.sel]=[s,m];ui.ed.sel=null;ui.ed.mod=1;render();return}
  if(ui.ed.darts.length>=3){toast('Drei Darts eingetragen. Mit OK bestätigen, mit CLR löschen oder einen Dart antippen, um ihn zu ändern.');return}
  ui.ed.darts.push([s,m]);ui.ed.mod=1;render()}
function commitDarts(){const g=game();if(!canThrow(g))return;let d=ui.ed.darts.map(x=>[...x]);
  if(!d.length){toast('Erst Darts eintragen. Für einen Fehlwurf „Miss“ tippen.');return}
  const inB=isIn(g,g.cur);let r=evalDarts(d,inB);
  if(d.length<3&&gTot(g)+r.s<g.target){while(d.length<3)d.push([0,1]);r=evalDarts(d,inB)}
  pushVisit(g,{p:g.cur,t:Date.now(),m:'d',d,...r})}
function commitTotal(){const g=game();if(!canThrow(g))return;const s=parseInt(ui.ed.total||'0',10);
  if(s>180||BAD.includes(s)){toast(`${s} Punkte sind mit drei Darts nicht möglich.`);return}
  if(!isIn(g,g.cur)){if(s===0)pushVisit(g,{p:g.cur,t:Date.now(),m:'s',d:null,s:0,n:3,pre:3,ci:false,miss:0});else{ui.modal={type:'checkin',score:s};render()}return}
  pushVisit(g,{p:g.cur,t:Date.now(),m:'s',d:null,s,n:3,pre:0,ci:false,miss:0})}
function undoVisit(){const g=game(),v=g.visits[g.visits.length-1];if(!v){toast('Noch keine Aufnahme eingetragen.');return}
  if(!g.parts.includes(v.p)){if(g.parts.length>=8){toast(`${pname(v.p)} ist nicht mehr in der Challenge und alle 8 Plätze sind belegt.`);return}g.parts.push(v.p)}
  if(!g.active.includes(v.p)){if(g.active.length>=4){toast(`${pname(v.p)} ist inaktiv. Zum Korrigieren zuerst aktivieren.`);return}
    g.active.push(v.p);g.active.sort((a,b)=>g.parts.indexOf(a)-g.parts.indexOf(b))}
  g.visits.pop();g.finished=null;g.cur=v.p;clearEd();
  if(S.settings.inputMode==='darts'){if(v.m==='d')ui.ed.darts=v.d.map(x=>[...x]);else toast('Diese Aufnahme wurde als Summe erfasst. Bitte die Darts neu eintragen.')}
  else ui.ed.total=String(v.s);
  save();render()}
function addPlayer(name){name=(name||'').trim();if(!name){toast('Bitte einen Namen eingeben.');return null}
  const ex=S.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(ex){toast(ex.archived?`„${ex.name}“ gibt es schon unter den archivierten Spielern.`:`„${ex.name}“ gibt es schon.`);return null}
  const p={id:uid(),name,archived:false,created:Date.now()};S.players.push(p);save();return p}
function confirmM(title,text,label,fn){ui.modal={type:'confirm',title,text,label,onYes:fn};render()}

/* ---------- Demodaten ---------- */
function simDart(sk,inn){const r=Math.random();
  if(!inn){const t=Math.random()<.5?20:16;if(r<.16+sk)return [t,2];if(r<.72)return [t,1];if(r<.9)return [[1,5,8,7][Math.floor(Math.random()*4)],1];return [0,1]}
  if(r<.03)return [0,1];if(r<.03+sk)return [20,3];if(r<.62)return [20,1];const nb=Math.random()<.5?1:5;if(r<.66)return [nb,3];if(r<.975)return [nb,1];return [25,Math.random()<.3?2:1]}
function simGame(target,parts,sk,frac){const g={id:uid(),target,created:0,finished:null,parts:[...parts],active:parts.slice(0,4),cur:parts[0],visits:[]};
  let t=0,tot=0,k=0,sess=0,len=170;const inn={};
  while(tot<target*frac){const p=g.active[k%g.active.length];k++;const d=[];let ii=!!inn[p];
    for(let j=0;j<3;j++){const x=simDart(sk[p],ii);d.push(x);if(!ii&&x[1]===2&&x[0]>0)ii=true}
    const r=evalDarts(d,!!inn[p]);if(r.ci)inn[p]=true;g.visits.push({p,t,m:'d',d,...r});tot+=r.s;t+=20000+Math.random()*25000;
    if(++sess>=len){sess=0;len=140+Math.random()*70;t+=(2+Math.floor(Math.random()*3))*864e5;
      const pool=[...g.parts].sort(()=>Math.random()-.5).slice(0,2+Math.floor(Math.random()*3));g.active=g.parts.filter(x=>pool.includes(x));k=0}}
  if(frac>=1)g.finished=t+5000;else g.cur=g.active[k%g.active.length];return g}
function shift(g,end){const d=end-(g.finished||lastT(g));g.visits.forEach(v=>v.t+=d);if(g.finished)g.finished+=d;g.created=(g.visits[0]?g.visits[0].t:end)-60000}
function makeDemo(){const names=['Anna','Ben','Carla','Deniz','Emil','Frieda','Gero'];
  const ids=names.map(n=>{let p=S.players.find(x=>x.name===n);if(!p){p={id:uid(),name:n,archived:false,created:Date.now()};S.players.push(p)}return p.id});
  const sk={};ids.forEach(id=>sk[id]=.05+Math.random()*.13);
  const g1=simGame(101000,ids.slice(0,5),sk,1);shift(g1,Date.now()-30*864e5);
  const g2=simGame(201000,ids.slice(1,7),sk,.36);shift(g2,Date.now()-15*60000);
  S.games.push(g1,g2)}

/* ---------- Aktionen ---------- */
const A={
  nav(v){ui.modal=null;ui.screen=v;go()},
  openGame(id){ui.modal=null;ui.gameId=id;clearEd();ui.screen='game';go()},
  sum(id){ui.modal=null;ui.sumId=id;ui.screen='sum';go()},
  newGame(){ui.newG={target:101000,sel:[]};ui.screen='new';go()},
  ngT(v){ui.newG.target=+v;render()},
  ngP(id){const s=ui.newG.sel,i=s.indexOf(id);if(i>=0)s.splice(i,1);else{if(s.length>=8){toast('Maximal 8 Spieler pro Challenge.');return}s.push(id)}render()},
  ngAdd(){const p=addPlayer(document.getElementById('ngname').value);if(p){if(ui.newG.sel.length<8)ui.newG.sel.push(p.id);render();document.getElementById('ngname').focus()}},
  ngStart(){const s=ui.newG.sel;if(!s.length)return;const g={id:uid(),target:ui.newG.target,created:Date.now(),finished:null,parts:[...s],active:s.slice(0,4),cur:s[0],visits:[]};S.games.push(g);save();A.openGame(g.id)},
  delGame(id){confirmM('Challenge löschen?','Alle Aufnahmen dieser Challenge gehen verloren, auch in den Statistiken.','Löschen',()=>{S.games=S.games.filter(g=>g.id!==id);save()})},
  act(id){const g=game();
    if(g.active.includes(id)){g.active=g.active.filter(x=>x!==id);if(g.cur===id){clearEd();advance(g)}}
    else{if(g.active.length>=4){toast('Maximal 4 aktive Spieler. Zuerst einen anderen Spieler deaktivieren.');return}
      g.active.push(id);g.active.sort((a,b)=>g.parts.indexOf(a)-g.parts.indexOf(b));if(!g.cur)g.cur=id}
    save();render()},
  mod(v){v=+v;ui.ed.mod=ui.ed.mod===v?1:v;render()},
  num(v){dart(+v,ui.ed.mod)},
  bull(){if(ui.ed.mod===3){toast('Triple-Bull gibt es nicht.');ui.ed.mod=1;render();return}dart(25,ui.ed.mod)},
  miss(){dart(0,1)},
  clr(){clearEd();render()},
  slot(i){i=+i;ui.ed.sel=ui.ed.sel===i?null:i;ui.ed.mod=1;render()},
  ok(){S.settings.inputMode==='darts'?commitDarts():commitTotal()},
  last(){undoVisit()},
  dig(v){if(ui.ed.total.length>=3)return;ui.ed.total=(ui.ed.total==='0'?'':ui.ed.total)+v;render()},
  quick(v){ui.ed.total=String(v);render()},
  bs(){ui.ed.total=ui.ed.total.slice(0,-1);render()},
  ci(k){const sc=ui.modal.score,g=game();ui.modal=null;pushVisit(g,{p:g.cur,t:Date.now(),m:'s',d:null,s:sc,n:3,pre:+k-1,ci:true,miss:0})},
  closeM(){ui.modal=null;render()},
  pst(id){ui.modal={type:'pstat',pid:id};render()},
  parts(){ui.modal={type:'parts'};render()},
  pRem(id){const g=game();if(g.parts.length<=1){toast('Mindestens ein Spieler muss in der Challenge bleiben.');return}
    g.active=g.active.filter(x=>x!==id);if(g.cur===id){clearEd();advance(g);if(g.cur===id)g.cur=null}g.parts=g.parts.filter(x=>x!==id);save();render()},
  pAdd(id){const g=game();if(g.parts.length>=8){toast('Maximal 8 Spieler pro Challenge.');return}if(g.parts.includes(id))return;
    g.parts.push(id);if(g.active.length<4){g.active.push(id);g.active.sort((a,b)=>g.parts.indexOf(a)-g.parts.indexOf(b));if(!g.cur)g.cur=id}save();render()},
  pNew(){const g=game();if(g.parts.length>=8){toast('Maximal 8 Spieler pro Challenge.');return}const p=addPlayer(document.getElementById('pnew').value);if(p)A.pAdd(p.id)},
  pnav(d){const g=game(),n=g.parts.length,i=g.parts.indexOf(ui.modal.pid);ui.modal.pid=g.parts[(i+(+d)+n)%n];render()},
  yes(){const f=ui.modal&&ui.modal.onYes;ui.modal=null;if(f)f();render()},
  addP(){if(addPlayer(document.getElementById('np').value))render()},
  arch(id){S.players.find(p=>p.id===id).archived=true;save();render();toast('Spieler archiviert. Statistiken bleiben erhalten.')},
  unarch(id){S.players.find(p=>p.id===id).archived=false;save();render()},
  togArch(){ui.showArch=!ui.showArch;render()},
  statSel(v){ui.statPlayer=v;render()},
  statMode(v){ui.statMode=v;render()},
  statPer(v){ui.statPer=v;render()},
  setIn(v){S.settings.inputMode=v;clearEd();save();render()},
  setTheme(v){S.settings.theme=v;applyTheme();save();render()},
  setFont(v){S.settings.font=v;applyTheme();save();render()},
  tile(v){const [grp,k]=v.split(':'),arr=S.settings[grp],max=0,i=arr.indexOf(k);
    if(i>=0)arr.splice(i,1);else arr.push(k);save();render()},
  resetTiles(){S.settings.tiles=defs().tiles;save();render()},
  setWake(v){S.settings.wake=v;save();wake(ui.screen==='game');render()},
  exp(){ui.modal={type:'export'};render()},
  copy(){const t=document.getElementById('expta');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('In die Zwischenablage kopiert.'),()=>toast('Der Text ist markiert. Bitte manuell kopieren.'))}catch(e){toast('Der Text ist markiert. Bitte manuell kopieren.')}},
  dl(){try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a'),d=new Date();
    a.href=u;a.download=`x01k-sicherung-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Sicherung gespeichert.')}catch(e){toast('Speichern nicht möglich. Bitte den Text kopieren.')}},
  imp(){ui.modal={type:'import'};render()},
  doImp(){let d;try{d=JSON.parse(document.getElementById('impta').value)}catch(e){toast('Das ist kein gültiger Export-Text.');return}
    if(!d||!Array.isArray(d.players)||!Array.isArray(d.games)){toast('Der Text enthält keine X01k-Daten.');return}
    confirmM('Daten ersetzen?','Alle Spieler, Challenges und Einstellungen auf diesem Gerät werden durch die importierten Daten ersetzt.','Ersetzen',()=>{S=d;S.settings=normSet(d.settings);applyTheme();save();toast('Daten importiert.')})},
  demo(){makeDemo();save();toast('Demodaten erzeugt: 7 Spieler, eine abgeschlossene und eine laufende Challenge.');render()},
  wipe(){confirmM('Alle Daten löschen?','Spieler, Challenges und Statistiken werden von diesem Gerät entfernt. Das lässt sich nicht rückgängig machen.','Alles löschen',()=>{S={v:1,players:[],games:[],settings:defs()};applyTheme();save()})}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset.v,el)});
document.addEventListener('change',e=>{if(e.target.id!=='impfile'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const t=document.getElementById('impta');if(t)t.value=r.result;A.doImp()};r.readAsText(e.target.files[0])});
document.addEventListener('keydown',e=>{if(ui.modal&&ui.modal.type==='pstat'){if(e.key==='ArrowLeft')return A.pnav(-1);if(e.key==='ArrowRight')return A.pnav(1);if(e.key==='Escape')return A.closeM()}if(e.key!=='Enter')return;if(e.target.id==='np')A.addP();if(e.target.id==='pnew')A.pNew();if(e.target.id==='ngname')A.ngAdd()});

(async()=>{await DB.open();const st=await loadAll();
  if(st&&Array.isArray(st.players))S=st;S.settings=normSet(S.settings);applyTheme();render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
